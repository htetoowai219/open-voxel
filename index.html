<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Open-Voxel — an agent-native local studio for rigged 3D voxel sprites, animation, VFX, and sprite-sheet export."
    />
    <title>Open-Voxel — Voxel Sprite Studio</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('open-voxel-theme');
          const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          const theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
